name: Docker images
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
permissions: { contents: read, packages: write, security-events: write }
env: { REGISTRY: ghcr.io, IMAGE_PREFIX: ${{ github.repository_owner }}/syncspace }
jobs:
  build:
    runs-on: ubuntu-latest
    strategy: { matrix: { include: [{ name: web, context: ., file: Dockerfile }, { name: api, context: backend/api, file: docker/Dockerfile.service }, { name: realtime, context: backend/realtime, file: docker/Dockerfile.service }, { name: worker, context: backend/worker, file: docker/Dockerfile.service }] } }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/metadata-action@v5
        id: meta
        with: { images: ghcr.io/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}, tags: type=sha,prefix=sha-,type=ref,event=tag }
      - uses: docker/build-push-action@v6
        with: { context: ${{ matrix.context }}, file: ${{ matrix.file }}, push: true, tags: ${{ steps.meta.outputs.tags }}, labels: ${{ steps.meta.outputs.labels }}, cache-from: type=gha, cache-to: type=gha,mode=max }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: ghcr.io/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:sha-${{ github.sha }}, format: table, exit-code: '1', ignore-unfixed: true, severity: CRITICAL,HIGH }
