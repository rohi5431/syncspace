services:
  web:
    build: .
    ports: ["3000:3000"]
    env_file: .env.development
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
  api:
    build: { context: ./backend/api, dockerfile: ../../docker/Dockerfile.service }
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://syncspace:syncspace@postgres:5432/syncspace
      MONGODB_URI: ${MONGODB_URI:-mongodb://localhost:27017/syncspace}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["3001"]
    restart: unless-stopped
  realtime-1:
    build: { context: ./backend/realtime, dockerfile: ../../docker/Dockerfile.service }
    environment: { PORT: 3002, REDIS_URL: redis://redis:6379 }
    depends_on: { redis: { condition: service_healthy } }
    expose: ["3002"]
    restart: unless-stopped
  realtime-2:
    build: { context: ./backend/realtime, dockerfile: ../../docker/Dockerfile.service }
    environment: { PORT: 3003, REDIS_URL: redis://redis:6379 }
    depends_on: { redis: { condition: service_healthy } }
    expose: ["3003"]
    restart: unless-stopped
  worker:
    build: { context: ./backend/worker, dockerfile: ../../docker/Dockerfile.service }
    environment: { REDIS_URL: redis://redis:6379, DATABASE_URL: postgresql://syncspace:syncspace@postgres:5432/syncspace }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: syncspace, POSTGRES_PASSWORD: syncspace, POSTGRES_DB: syncspace }
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U syncspace -d syncspace"], interval: 10s, timeout: 5s, retries: 5 }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 10s, timeout: 5s, retries: 5 }
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [web, api, realtime-1, realtime-2]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: [./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.3.0
    volumes: [grafana-data:/var/lib/grafana]
    ports: ["3005:3000"]
volumes: { postgres-data: {}, redis-data: {}, grafana-data: {} }
