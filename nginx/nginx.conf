events {}
http {
  upstream web { server web:3000; }
  upstream api { server api:3001; }
  upstream realtime { least_conn; server realtime-1:3002; server realtime-2:3003; }
  server {
    listen 80;
    location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /socket.io/ { proxy_pass http://realtime; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
    location / { proxy_pass http://web; proxy_set_header Host $host; }
  }
}
